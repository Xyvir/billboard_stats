name: weekly-etl

on:
  workflow_dispatch:
  schedule:
    - cron: "42 * * * *"

# Required so the bot can push the JSON files back to your repository
permissions:
  contents: write

jobs:
  weekly-etl:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Flat-File ETL and Enrichment
        run: bash scripts/run_weekly_etl.sh

      - name: Commit and push new JSON data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add billboard_stats/data/
          
          if [ "${ACT}" == "true" ]; then
            echo "Jane says we are running locally via act. Skipping the push."
            git status
          else
            git diff --quiet && git diff --staged --quiet || (git commit -q -m "chore: automate chart scrape" && git push -q)
          fi
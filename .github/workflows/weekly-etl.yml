name: weekly-etl

on:
  workflow_dispatch:
  schedule:
    - cron: "42 * * * *"

# Required so the bot can push the JSON files back to your repository
permissions:
  contents: write

jobs:
  weekly-etl:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Flat-File ETL and Enrichment
        run: bash scripts/run_weekly_etl.sh

      - name: Commit and push new JSON data
        run: |
          if [ "${ACT}" == "true" ]; then
            echo "Jane confirms local execution. Bypassing Git config, staging, and push to save you from WSL2 I/O hell."
          else
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            git add billboard_stats/data/
            git diff --quiet && git diff --staged --quiet || (git commit -q -m "chore: automate chart scrape" && git push -q)
          fi
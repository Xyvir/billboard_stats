<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billboard Stats Shell</title>
    <style>
        :root {
            --bg: #121212;
            --text: #e0e0e0;
            --accent: #ff4757;
            --border: #333;
            color-scheme: dark;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
        }
        input, select, button {
            padding: 0.5rem 1rem;
            background: #222;
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 4px;
        }
        button {
            background: var(--accent);
            color: white;
            cursor: pointer;
            font-weight: bold;
            border: none;
        }
        button:hover { background: #ff6b81; }
        
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(42%) sepia(76%) saturate(3199%) hue-rotate(326deg) brightness(102%) contrast(103%);
            cursor: pointer;
        }

        /* View Toggling */
        .view-section { display: none; }
        .view-section.active { display: block; }

        .chart-entry {
            display: flex;
            align-items: center;
            padding: 1rem;
            border-bottom: 1px solid var(--border);
        }
        .rank {
            font-size: 1.5rem;
            font-weight: bold;
            width: 50px;
            color: var(--accent);
        }
        .details h3 { 
            margin: 0 0 0.25rem 0; 
            cursor: pointer;
        }
        .details h3:hover { text-decoration: underline; color: var(--accent); }
        .details p { 
            margin: 0; color: #888; font-size: 0.9rem; 
            cursor: pointer;
        }
        .details p:hover { color: white; }
        
        .stat-badge {
            font-size: 0.8rem;
            background: #333;
            padding: 2px 6px;
            border-radius: 4px;
            margin-right: 8px;
        }

        .back-btn { margin-bottom: 2rem; background: #444; }
    </style>
</head>
<body>

    <h1>Billboard Stats</h1>
    
    <div id="view-home" class="view-section active">
        <div style="margin-bottom: 2rem; display: flex; gap: 1rem; flex-wrap: wrap;">
            <select id="chartType">
                <option value="hot100">Hot 100</option>
                <option value="b200">Billboard 200</option>
            </select>
            <input type="date" id="dateInput" value="2026-04-04">
            <button onclick="loadChart()">Load Week</button>
            <div style="position: relative;">
                <input type="text" id="searchInput" placeholder="Search (Artist/Song)..." onkeyup="handleSearch(event)" onfocus="handleSearch(event)">
                <div id="searchResults" style="display: none; position: absolute; top: 100%; left: 0; background: #222; border: 1px solid var(--border); width: 300px; max-height: 400px; overflow-y: auto; z-index: 1000; border-radius: 4px; box-shadow: 0 4px 6px rgba(0,0,0,0.5);"></div>
            </div>
        </div>

        <div id="loading" style="display: none;">Fetching data...</div>
        <div id="error" style="color: #ff4757; display: none;"></div>
        <div id="chartContainer"></div>
    </div>

    <div id="view-detail" class="view-section">
        <button class="back-btn" onclick="showView('view-home')">← Back to Charts</button>
        <div id="detailLoading" style="display: none;">Loading profile...</div>
        <div id="detailError" style="color: #ff4757; display: none;"></div>
        
        <div id="detailHeader"></div>
        <div id="detailStats" style="margin: 1rem 0; padding: 1rem; background: #1a1a1a; border-radius: 8px;"></div>
        <div id="detailHistory"></div>
    </div>

    <script>
        const DATA_DIR = './billboard_stats/data';
        let searchIndex = null;

        // Close search results when clicking outside
        document.addEventListener('click', (e) => {
            if (!e.target.closest('#searchInput') && !e.target.closest('#searchResults')) {
                document.getElementById('searchResults').style.display = 'none';
            }
        });

        function showView(viewId) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
        }

        function snapToSaturday(dateStr) {
            const d = new Date(dateStr + "T00:00:00Z");
            const diff = 6 - d.getUTCDay(); 
            d.setUTCDate(d.getUTCDate() + diff);
            return d.toISOString().split('T')[0];
        }

        async function fetchSearchIndex() {
            if (searchIndex) return searchIndex;
            try {
                const response = await fetch(`${DATA_DIR}/search_index.json`);
                if (response.ok) {
                    searchIndex = await response.json();
                    return searchIndex;
                }
            } catch (e) {
                console.error("No search index found:", e);
            }
            return null;
        }

        async function handleSearch(event) {
            const query = event.target.value.toLowerCase().trim();
            const resultsContainer = document.getElementById('searchResults');
            
            if (query.length < 2) {
                resultsContainer.style.display = 'none';
                return;
            }

            const index = await fetchSearchIndex();
            if (!index) return;

            // Ignore albums by only checking artists and songs
            const matchedArtists = (index.artists || []).filter(artist => 
                (artist.name || '').toLowerCase().includes(query)
            ).slice(0, 5);
            
            const matchedSongs = (index.songs || []).filter(song => 
                (song.name || song.title || '').toLowerCase().includes(query) || 
                (song.artist || '').toLowerCase().includes(query)
            ).slice(0, 10);

            if (matchedArtists.length === 0 && matchedSongs.length === 0) {
                resultsContainer.innerHTML = '<div style="padding: 0.5rem; color: #888;">No results found</div>';
                resultsContainer.style.display = 'block';
                return;
            }

            let html = '';
            
            if (matchedArtists.length > 0) {
                html += '<div style="padding: 0.5rem; background: #333; font-weight: bold; font-size: 0.8rem; text-transform: uppercase;">Artists</div>';
                matchedArtists.forEach(artist => {
                    const id = artist.id || artist.ref;
                    html += `<div style="padding: 0.5rem; cursor: pointer; border-bottom: 1px solid var(--border);" 
                                  onclick="document.getElementById('searchResults').style.display='none'; loadDetail('artists', '${id}')"
                                  onmouseover="this.style.background='#333'" onmouseout="this.style.background='transparent'">
                                  ${artist.name}
                             </div>`;
                });
            }

            if (matchedSongs.length > 0) {
                html += '<div style="padding: 0.5rem; background: #333; font-weight: bold; font-size: 0.8rem; text-transform: uppercase;">Songs</div>';
                matchedSongs.forEach(song => {
                    const id = song.id || song.ref;
                    html += `<div style="padding: 0.5rem; cursor: pointer; border-bottom: 1px solid var(--border);" 
                                  onclick="onSongSearchClick('${id}')"
                                  onmouseover="this.style.background='#333'" onmouseout="this.style.background='transparent'">
                                <div style="font-weight: bold; color: white;">${song.name || song.title}</div>
                                <div style="font-size: 0.8rem; color: #aaa;">${song.artist}</div>
                             </div>`;
                });
            }

            resultsContainer.innerHTML = html;
            resultsContainer.style.display = 'block';
        }

        async function onSongSearchClick(songId) {
            document.getElementById('searchResults').style.display = 'none';
            const currentChartType = document.getElementById('chartType').value;

            try {
                const response = await fetch(`${DATA_DIR}/songs/${songId}.json`);
                if (!response.ok) throw new Error("Song data not found");
                const songData = await response.json();

                const history = songData.history || songData.chart_history || songData.charts || [];
                
                // Filter for history matching the currently selected chart dropdown
                const relevantHistory = history.filter(entry => 
                    (entry.chart || entry.chart_name || entry.name || '').toLowerCase().replace(/[^a-z0-9]/g, '') === currentChartType.toLowerCase().replace(/[^a-z0-9]/g, '') ||
                    (currentChartType === 'hot100' && (entry.chart || '').toLowerCase().includes('hot 100')) ||
                    (currentChartType === 'b200' && (entry.chart || '').toLowerCase().includes('200'))
                );
                
                if (relevantHistory.length > 0) {
                    // Sort descending to find the most recent
                    relevantHistory.sort((a, b) => new Date(b.date || b.week) - new Date(a.date || a.week));
                    const mostRecentDate = relevantHistory[0].date || relevantHistory[0].week;

                    if (mostRecentDate) {
                        document.getElementById('dateInput').value = mostRecentDate;
                        loadChart();
                        return;
                    }
                }
                
                alert(`This song doesn't seem to have a recent history on the selected chart (${currentChartType}).`);
            } catch (error) {
                console.error("Error fetching song details for redirect:", error);
                // Fallback to simply opening the song detail view
                loadDetail('songs', songId);
            }
        }

        async function loadChart() {
            const chartType = document.getElementById('chartType').value;
            const rawDate = document.getElementById('dateInput').value;
            if (!rawDate) return;

            const container = document.getElementById('chartContainer');
            const errorDiv = document.getElementById('error');
            const loading = document.getElementById('loading');

            container.innerHTML = '';
            errorDiv.style.display = 'none';
            loading.style.display = 'block';

            const snappedDate = snapToSaturday(rawDate);
            document.getElementById('dateInput').value = snappedDate;

            try {
                const response = await fetch(`${DATA_DIR}/${chartType}/${snappedDate}.json`);
                if (!response.ok) throw new Error(`Chart data for ${snappedDate} not found.`);
                
                const data = await response.json();
                renderChart(data);
            } catch (err) {
                errorDiv.textContent = err.message;
                errorDiv.style.display = 'block';
            } finally {
                loading.style.display = 'none';
            }
        }

        function renderChart(data) {
            const container = document.getElementById('chartContainer');
            
            data.forEach(track => {
                const row = document.createElement('div');
                row.className = 'chart-entry';
                
                // Fallbacks applied in case the ETL hasn't reached this file yet
                const peak = track.peak_position || '-';
                const wks = track.weeks_on_chart || '-';
                const id = track.id || null;
                const artistId = track.artist_id || null;
                
                row.innerHTML = `
                    <div class="rank">${track.rank || track.position}</div>
                    <div class="details">
                        <h3 onclick="loadDetail('songs', '${id}')">${track.title || track.song}</h3>
                        <p onclick="loadDetail('artists', '${artistId}')">${track.artist}</p>
                        <div style="margin-top: 6px;">
                            <span class="stat-badge">Peak: ${peak}</span>
                            <span class="stat-badge">Weeks: ${wks}</span>
                        </div>
                    </div>
                `;
                container.appendChild(row);
            });
        }

        async function loadDetail(type, itemId) {
            if (!itemId || itemId === 'null') {
                alert("This record hasn't been processed by the new ETL yet.");
                return;
            }

            showView('view-detail');
            const header = document.getElementById('detailHeader');
            const stats = document.getElementById('detailStats');
            const errorDiv = document.getElementById('detailError');
            const loading = document.getElementById('detailLoading');

            header.innerHTML = '';
            stats.innerHTML = '';
            errorDiv.style.display = 'none';
            loading.style.display = 'block';

            try {
                const response = await fetch(`${DATA_DIR}/${type}/${itemId}.json`);
                if (!response.ok) throw new Error(`Profile not generated yet. Check ETL logs.`);
                
                const data = await response.json();
                
                // Extremely basic render, you will need to expand this based on the exact
                // JSON structure your Python script dumps into the profile files.
                header.innerHTML = `<h2>${data.name || data.title}</h2>`;
                stats.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
                
            } catch (err) {
                errorDiv.textContent = err.message;
                errorDiv.style.display = 'block';
            } finally {
                loading.style.display = 'none';
            }
        }
    </script>
</body>
</html>

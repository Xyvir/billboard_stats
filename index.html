<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billboard Stats Shell</title>
    <style>
        :root {
            --bg: #121212;
            --text: #e0e0e0;
            --accent: #ff4757;
            --border: #333;
            color-scheme: dark;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
        }
        input, select, button {
            padding: 0.5rem 1rem;
            background: #222;
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 4px;
        }
        button {
            background: var(--accent);
            color: white;
            cursor: pointer;
            font-weight: bold;
            border: none;
        }
        button:hover:not(:disabled) { background: #ff6b81; }
        button:disabled {
            background: #222 !important;
            color: #555 !important;
            cursor: not-allowed;
        }
        
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(42%) sepia(76%) saturate(3199%) hue-rotate(326deg) brightness(102%) contrast(103%);
            cursor: pointer;
        }

        /* View Toggling */
        .view-section { display: none; }
        .view-section.active { display: block; }

        .chart-entry {
            display: flex;
            align-items: center;
            padding: 1rem;
            border-bottom: 1px solid var(--border);
        }
        .rank {
            font-size: 1.5rem;
            font-weight: bold;
            width: 50px;
            color: var(--accent);
        }
        .details h3 { 
            margin: 0 0 0.25rem 0; 
            cursor: pointer;
        }
        .details h3:hover { text-decoration: underline; color: var(--accent); }
        .details p { 
            margin: 0; color: #888; font-size: 0.9rem; 
            cursor: pointer;
        }
        .details p:hover { color: white; }
        
        .stat-badge {
            font-size: 0.8rem;
            background: #333;
            padding: 2px 6px;
            border-radius: 4px;
            margin-right: 8px;
        }

        .back-btn { margin-bottom: 2rem; background: #444; }
    </style>
</head>
<body>

    <h1>Billboard Stats</h1>
    
    <div id="view-home" class="view-section active">
        <div style="margin-bottom: 2rem; display: flex; gap: 1rem; flex-wrap: wrap;">
            <button id="btn-hot100" onclick="switchChart('hot100')" style="background: var(--accent); color: white;">Hot 100</button>
            <button id="btn-b200" onclick="switchChart('b200')" style="background: #333; color: white;">Billboard 200</button>
            <div style="display: flex; align-items: center; gap: 0.5rem;">
                <button id="btn-prev-week" onclick="changeWeek(-1)" style="background: #444;">&lt; Prev</button>
                <input type="date" id="dateInput" value="2026-04-04" onchange="loadChart()">
                <button id="btn-next-week" onclick="changeWeek(1)" style="background: #444;">Next &gt;</button>
            </div>
            <div style="position: relative;">
                <input type="text" id="searchInput" placeholder="Search (Artist/Song)..." onkeyup="handleSearch(event)" onfocus="handleSearch(event)">
                <div id="searchResults" style="display: none; position: absolute; top: 100%; left: 0; background: #222; border: 1px solid var(--border); width: 300px; max-height: 400px; overflow-y: auto; z-index: 1000; border-radius: 4px; box-shadow: 0 4px 6px rgba(0,0,0,0.5);"></div>
            </div>
        </div>

        <div id="loading" style="display: none;">Fetching data...</div>
        <div id="error" style="color: #ff4757; display: none;"></div>
        <div id="chartContainer"></div>
    </div>

    <div id="view-detail" class="view-section">
        <button class="back-btn" onclick="showView('view-home')">← Back to Charts</button>
        <div id="detailLoading" style="display: none;">Loading profile...</div>
        <div id="detailError" style="color: #ff4757; display: none;"></div>
        
        <div id="detailHeader"></div>
        <div id="detailStats" style="margin: 1rem 0; padding: 1rem; background: #1a1a1a; border-radius: 8px;"></div>
        <div id="detailHistory"></div>
    </div>

    <script>
        const DATA_DIR = './billboard_stats/data';
        let searchIndex = null;
        let currentChartType = 'hot100';

        function switchChart(type) {
            currentChartType = type;
            const hot100Btn = document.getElementById('btn-hot100');
            const b200Btn = document.getElementById('btn-b200');
            
            if (type === 'hot100') {
                document.documentElement.style.setProperty('--accent', '#ff4757');
                hot100Btn.style.background = 'var(--accent)';
                b200Btn.style.background = '#333';
            } else {
                document.documentElement.style.setProperty('--accent', '#a55eea');
                b200Btn.style.background = 'var(--accent)';
                hot100Btn.style.background = '#333';
            }
            loadChart();
        }

        // Close search results when clicking outside
        document.addEventListener('click', (e) => {
            if (!e.target.closest('#searchInput') && !e.target.closest('#searchResults')) {
                document.getElementById('searchResults').style.display = 'none';
            }
        });

        function showView(viewId) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
        }

        function snapToSaturday(dateStr) {
            const d = new Date(dateStr + "T00:00:00Z");
            const diff = 6 - d.getUTCDay(); 
            d.setUTCDate(d.getUTCDate() + diff);
            return d.toISOString().split('T')[0];
        }

        function updateWeekButtons(currentDate) {
            const minDate = "1958-08-04";
            const maxDate = "2026-05-16";
            document.getElementById('btn-prev-week').disabled = currentDate <= minDate;
            document.getElementById('btn-next-week').disabled = currentDate >= maxDate;
        }

        function changeWeek(offset) {
            const dateInput = document.getElementById('dateInput');
            const d = new Date(dateInput.value + "T00:00:00Z");
            d.setUTCDate(d.getUTCDate() + (offset * 7));
            const newDateStr = d.toISOString().split('T')[0];
            const snappedDate = snapToSaturday(newDateStr);
            
            const minDate = "1958-08-04";
            const maxDate = "2026-05-16";
            
            if (snappedDate < minDate) dateInput.value = minDate;
            else if (snappedDate > maxDate) dateInput.value = maxDate;
            else dateInput.value = snappedDate;
            
            loadChart();
        }

        async function fetchSearchIndex() {
            if (searchIndex) return searchIndex;
            try {
                const response = await fetch(`${DATA_DIR}/search_index.json`);
                if (response.ok) {
                    searchIndex = await response.json();
                    return searchIndex;
                }
            } catch (e) {
                console.error("No search index found:", e);
            }
            return null;
        }

        async function handleSearch(event) {
            const query = event.target.value.toLowerCase().trim();
            const resultsContainer = document.getElementById('searchResults');
            
            if (query.length < 2) {
                resultsContainer.style.display = 'none';
                return;
            }

            const index = await fetchSearchIndex();
            if (!index) return;

            // Ignore albums by only checking artists and songs
            const matchedArtists = (index.artists || []).filter(artist => 
                (artist.name || '').toLowerCase().includes(query)
            ).slice(0, 5);
            
            const matchedSongs = (index.songs || []).filter(song => 
                (song.name || song.title || '').toLowerCase().includes(query) || 
                (song.artist || '').toLowerCase().includes(query)
            ).slice(0, 10);

            const matchedAlbums = (index.albums || []).filter(album => 
                (album.name || album.title || '').toLowerCase().includes(query) || 
                (album.artist || '').toLowerCase().includes(query)
            ).slice(0, 10);

            if (matchedArtists.length === 0 && matchedSongs.length === 0 && matchedAlbums.length === 0) {
                resultsContainer.innerHTML = '<div style="padding: 0.5rem; color: #888;">No results found</div>';
                resultsContainer.style.display = 'block';
                return;
            }

            let html = '';
            
            if (matchedArtists.length > 0) {
                html += '<div style="padding: 0.5rem; background: #333; font-weight: bold; font-size: 0.8rem; text-transform: uppercase;">Artists</div>';
                matchedArtists.forEach(artist => {
                    let id = artist.id || artist.ref || artist.artist_id || artist.path;
                    if (id) {
                        id = String(id).replace(/^artists\//, '').replace(/\.json$/, '');
                    }
                    const encodedId = id ? encodeURIComponent(id) : '';
                    html += `<div style="padding: 0.5rem; cursor: pointer; border-bottom: 1px solid var(--border);" 
                                  onclick="onArtistSearchClick('${encodedId}')"
                                  onmouseover="this.style.background='#333'" onmouseout="this.style.background='transparent'">
                                  ${artist.name}
                             </div>`;
                });
            }

            if (matchedSongs.length > 0) {
                html += '<div style="padding: 0.5rem; background: #333; font-weight: bold; font-size: 0.8rem; text-transform: uppercase;">Songs</div>';
                matchedSongs.forEach(song => {
                    let id = song.id || song.ref || song.song_id || song.path;
                    if (id) {
                        id = String(id).replace(/^songs\//, '').replace(/\.json$/, '');
                    }
                    const encodedId = id ? encodeURIComponent(id) : '';
                    html += `<div style="padding: 0.5rem; cursor: pointer; border-bottom: 1px solid var(--border);" 
                                  onclick="onSongSearchClick('${encodedId}')"
                                  onmouseover="this.style.background='#333'" onmouseout="this.style.background='transparent'">
                                <div style="font-weight: bold; color: white;">${song.name || song.title}</div>
                                <div style="font-size: 0.8rem; color: #aaa;">${song.artist}</div>
                             </div>`;
                });
            }

            if (matchedAlbums.length > 0) {
                html += '<div style="padding: 0.5rem; background: #333; font-weight: bold; font-size: 0.8rem; text-transform: uppercase;">Albums</div>';
                matchedAlbums.forEach(album => {
                    let id = album.id || album.ref || album.album_id || album.path;
                    if (id) {
                        id = String(id).replace(/^albums\//, '').replace(/\.json$/, '');
                    }
                    const encodedId = id ? encodeURIComponent(id) : '';
                    html += `<div style="padding: 0.5rem; cursor: pointer; border-bottom: 1px solid var(--border);" 
                                  onclick="onAlbumSearchClick('${encodedId}')"
                                  onmouseover="this.style.background='#333'" onmouseout="this.style.background='transparent'">
                                <div style="font-weight: bold; color: white;">${album.name || album.title}</div>
                                <div style="font-size: 0.8rem; color: #aaa;">${album.artist}</div>
                             </div>`;
                });
            }

            resultsContainer.innerHTML = html;
            resultsContainer.style.display = 'block';
        }

        function onArtistSearchClick(encodedId) {
            document.getElementById('searchResults').style.display = 'none';
            const artistId = decodeURIComponent(encodedId);
            loadDetail('artists', artistId);
        }

        function onSongSearchClick(encodedId) {
            document.getElementById('searchResults').style.display = 'none';
            const songId = decodeURIComponent(encodedId);
            loadDetail('songs', songId);
        }

        function onAlbumSearchClick(encodedId) {
            document.getElementById('searchResults').style.display = 'none';
            const albumId = decodeURIComponent(encodedId);
            loadDetail('albums', albumId);
        }

        function loadHistoricalChart(date, chartStr) {
            document.getElementById('dateInput').value = date;
            
            // Try to match the dropdown to the chart context if available
            if (chartStr) {
                const cleanChart = chartStr.toLowerCase().replace(/[^a-z0-9]/g, '');
                if (cleanChart.includes('hot')) {
                    switchChart('hot100');
                    return;
                }
                if (cleanChart.includes('200')) {
                    switchChart('b200');
                    return;
                }
            }
            
            showView('view-home');
            loadChart();
        }

        async function loadChart() {
            const chartType = currentChartType;
            const rawDate = document.getElementById('dateInput').value;
            if (!rawDate) return;

            const container = document.getElementById('chartContainer');
            const errorDiv = document.getElementById('error');
            const loading = document.getElementById('loading');

            container.innerHTML = '';
            errorDiv.style.display = 'none';
            loading.style.display = 'block';

            const snappedDate = snapToSaturday(rawDate);
            document.getElementById('dateInput').value = snappedDate;
            updateWeekButtons(snappedDate);

            try {
                const response = await fetch(`${DATA_DIR}/${chartType}/${snappedDate}.json`);
                if (!response.ok) throw new Error(`Chart data for ${snappedDate} not found.`);
                
                const data = await response.json();
                renderChart(data);
            } catch (err) {
                errorDiv.textContent = err.message;
                errorDiv.style.display = 'block';
            } finally {
                loading.style.display = 'none';
            }
        }

        function renderChart(data) {
            const container = document.getElementById('chartContainer');
            const entityType = currentChartType === 'b200' ? 'albums' : 'songs';
            
            data.forEach(track => {
                const row = document.createElement('div');
                row.className = 'chart-entry';
                
                // Fallbacks applied in case the ETL hasn't reached this file yet
                const peak = track.peak_position || '-';
                const wks = track.weeks_on_chart || '-';
                const id = track.id || track.album_id || track.song_id || null;
                const artistId = track.artist_id || null;
                const title = track.title || track.song || track.album || track.name || 'Unknown';
                
                row.innerHTML = `
                    <div class="rank">${track.rank || track.position}</div>
                    <div class="details">
                        <h3 onclick="loadDetail('${entityType}', '${id}')">${title}</h3>
                        <p onclick="loadDetail('artists', '${artistId}')">${track.artist}</p>
                        <div style="margin-top: 6px;">
                            <span class="stat-badge">Peak: ${peak}</span>
                            <span class="stat-badge">Weeks: ${wks}</span>
                        </div>
                    </div>
                `;
                container.appendChild(row);
            });
        }

        async function loadDetail(type, itemId) {
            if (!itemId || itemId === 'null' || itemId === 'undefined') {
                alert("This record hasn't been processed by the new ETL yet.");
                return;
            }

            showView('view-detail');
            const header = document.getElementById('detailHeader');
            const stats = document.getElementById('detailStats');
            const errorDiv = document.getElementById('detailError');
            const loading = document.getElementById('detailLoading');

            header.innerHTML = '';
            stats.innerHTML = '';
            errorDiv.style.display = 'none';
            loading.style.display = 'block';

            try {
                const response = await fetch(`${DATA_DIR}/${type}/${itemId}.json`);
                if (!response.ok) throw new Error(`Profile not generated yet. Check ETL logs.`);
                
                const data = await response.json();
                
                header.innerHTML = `<h2 style="margin-bottom: 0.5rem;">${data.name || data.title || 'Profile'}</h2>`;
                
                let html = '';
                
                if (data.artist) {
                    const artistId = encodeURIComponent(data.artist.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''));
                    html += `<div style="font-size: 1.1rem; color: #aaa; margin-bottom: 1rem; cursor: pointer; display: inline-block;" 
                                  onmouseover="this.style.color='var(--accent)'" 
                                  onmouseout="this.style.color='#aaa'"
                                  onclick="loadDetail('artists', '${artistId}')">${data.artist}</div><br>`;
                }
                if (data.peak) html += `<span class="stat-badge" style="font-size: 0.9rem;">Peak: #${data.peak}</span>`;
                if (data.weeks_on_chart || data.total_weeks) html += `<span class="stat-badge" style="font-size: 0.9rem;">Weeks: ${data.weeks_on_chart || data.total_weeks}</span>`;

                // Render Chart History (Songs & Albums)
                const history = data.history || data.chart_history || data.charts || data.chart_weeks;
                if (history && Array.isArray(history) && history.length > 0) {
                    let titleText = 'Chart History';
                    let titleColor = '#ffffff';
                    
                    if (type === 'songs') {
                        titleText = 'Top100 Chart History';
                        titleColor = '#ff4757';
                    } else if (type === 'albums') {
                        titleText = 'BB200 Chart History';
                        titleColor = '#a55eea';
                    }

                    html += `<h3 style="margin-top: 2rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; color: ${titleColor};">${titleText}</h3>`;
                    html += `<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; margin-top: 1rem;">`;
                    history.forEach(entry => {
                        const date = entry.date || entry.week || entry.chart_date;
                        const rank = entry.rank || entry.position;
                        const chart = entry.chart || entry.chart_name || entry.chart_type || '';
                        if (date) {
                            let entryColor = 'var(--accent)';
                            if (chart.toLowerCase().includes('hot') || (!chart && type === 'songs')) {
                                entryColor = '#ff4757';
                            } else if (chart.toLowerCase().includes('200') || (!chart && type === 'albums')) {
                                entryColor = '#a55eea';
                            }

                            html += `<div style="background: #222; padding: 10px; border-radius: 4px; text-align: center; cursor: pointer; border: 1px solid var(--border);" 
                                         onmouseover="this.style.borderColor='${entryColor}'" 
                                         onmouseout="this.style.borderColor='var(--border)'"
                                         onclick="loadHistoricalChart('${date}', '${chart}')">
                                        <div style="font-size: 0.8rem; color: #888;">${date}</div>
                                        <div style="font-size: 1.5rem; font-weight: bold; color: ${entryColor}; margin-top: 5px;">#${rank}</div>
                                     </div>`;
                        }
                    });
                    html += `</div>`;
                }

                // If this is an artist and we only have a flat items list, try to split it into albums and songs using search index
                if (type === 'artists' && !data.albums && !data.songs && data.items) {
                    const index = await fetchSearchIndex();
                    if (index && index.albums) {
                        const albumMap = new Map();
                        index.albums.forEach(a => {
                            const id = a.id || a.ref || a.album_id || a.path;
                            const cleanId = String(id).replace(/^albums\//, '').replace(/\.json$/, '');
                            albumMap.set(cleanId, a.title || a.name || cleanId);
                        });
                        
                        data.albums = [];
                        data.songs = [];
                        
                        data.items.forEach(item => {
                            const idStr = typeof item === 'string' ? item : (item.id || item.ref || item.song_id || item.path || '');
                            const cleanId = String(idStr).replace(/^(songs|albums)\//, '').replace(/\.json$/, '');
                            
                            if (albumMap.has(cleanId)) {
                                data.albums.push({ id: cleanId, title: albumMap.get(cleanId) });
                            } else {
                                data.songs.push(item);
                            }
                        });
                    }
                }

                // Render Catalog of Songs (Artists & Albums)
                const songs = data.songs || data.tracks || data.items;
                if (songs && Array.isArray(songs) && songs.length > 0) {
                    const sectionTitle = type === 'albums' ? 'Track Listing' : 'Songs';
                    html += `<h3 style="margin-top: 2rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem;">${sectionTitle}</h3>`;
                    
                    const renderSongRow = (song) => {
                        let songId = '';
                        let title = 'Unknown Song';
                        let peakHtml = '';

                        if (typeof song === 'string') {
                            songId = song;
                            // Clean up ID to make a readable title
                            let cleanTitle = songId;
                            if (data.id && cleanTitle.endsWith('-' + data.id)) {
                                cleanTitle = cleanTitle.slice(0, -(data.id.length + 1));
                            }
                            title = cleanTitle.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
                        } else {
                            songId = song.id || song.song_id || song.ref || song.path || '';
                            title = song.title || song.name || 'Unknown Song';
                            peakHtml = song.peak ? `<span class="stat-badge">Peak: #${song.peak}</span>` : '';
                        }

                        const cleanId = String(songId).replace(/^songs\//, '').replace(/\.json$/, '');
                        const encodedId = cleanId ? encodeURIComponent(cleanId) : '';
                        
                        if (!encodedId) {
                            return `<div style="background: #1a1a1a; padding: 10px; border-radius: 4px; border: 1px solid #333; display: flex; justify-content: space-between; align-items: center;">
                                        <strong style="color: #888;">${title}</strong>
                                        <span class="stat-badge" style="background: #333; color: #666;">Album Track</span>
                                     </div>`;
                        } else {
                            return `<div style="background: #222; padding: 10px; border-radius: 4px; cursor: pointer; border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;"
                                         onmouseover="this.style.borderColor='var(--accent)'" 
                                         onmouseout="this.style.borderColor='var(--border)'"
                                         onclick="loadDetail('songs', '${encodedId}')">
                                        <strong style="color: white;">${title}</strong>
                                        ${peakHtml}
                                     </div>`;
                        }
                    };

                    if (type === 'artists') {
                        const groupedSongs = {};
                        const singleSongs = [];
                        const albumLookup = {};
                        const renderedAlbumIds = new Set();

                        if (data.albums && Array.isArray(data.albums)) {
                            // Fetch all album details concurrently to get their tracklists
                            const albumFetchPromises = data.albums.map(async (album) => {
                                const aId = album.id || album.album_id || album.ref || album.path || '';
                                const aTitle = album.title || album.name || 'Unknown Album';
                                const cleanId = String(aId).replace(/^albums\//, '').replace(/\.json$/, '');
                                
                                if (cleanId) {
                                    albumLookup[aTitle] = { id: cleanId, songs: [] };
                                    try {
                                        const res = await fetch(`${DATA_DIR}/albums/${cleanId}.json`);
                                        if (res.ok) {
                                            const albumData = await res.json();
                                            const albumTracks = albumData.songs || albumData.tracks || albumData.items || [];
                                            albumLookup[aTitle].songs = albumTracks;
                                        }
                                    } catch (e) {
                                        // Ignore fetch errors if album json doesn't exist yet
                                    }
                                }
                            });
                            
                            await Promise.all(albumFetchPromises);
                        }

                        songs.forEach(song => {
                            let songId = typeof song === 'string' ? song : (song.id || song.song_id || song.ref || song.path || '');
                            const cleanSongId = String(songId).replace(/^(songs|albums)\//, '').replace(/\.json$/, '');
                            
                            // Sometimes the ETL mixes albums into the songs list. Skip it if it's an album.
                            const isAlbum = Object.values(albumLookup).some(a => a.id === cleanSongId);
                            if (isAlbum) return;

                            let foundInAlbum = false;
                            
                            // Try to find if this song belongs to one of the artist's albums
                            for (const [albumTitle, albumInfo] of Object.entries(albumLookup)) {
                                const albumHasTrack = albumInfo.songs.some(track => {
                                    let trackId = typeof track === 'string' ? track : (track.id || track.song_id || track.ref || track.path || '');
                                    return String(trackId).replace(/^songs\//, '').replace(/\.json$/, '') === cleanSongId;
                                });
                                
                                if (albumHasTrack) {
                                    if (!groupedSongs[albumTitle]) groupedSongs[albumTitle] = [];
                                    groupedSongs[albumTitle].push(song);
                                    foundInAlbum = true;
                                    break;
                                }
                            }
                            
                            // If it wasn't in any tracklist, it's a single or we don't have its album data
                            if (!foundInAlbum) {
                                singleSongs.push(song);
                            }
                        });

                        for (const [albumName, albumSongs] of Object.entries(groupedSongs)) {
                            if (albumSongs.length === 0) continue;
                            html += `<div style="margin-top: 1.5rem;">`;
                            const matchedAlbumId = albumLookup[albumName] ? albumLookup[albumName].id : null;
                            
                            if (matchedAlbumId) {
                                renderedAlbumIds.add(matchedAlbumId);
                                const encodedId = encodeURIComponent(matchedAlbumId);
                                html += `<h4 style="margin: 0 0 0.75rem 0; cursor: pointer; color: var(--text); display: inline-block;"
                                             onmouseover="this.style.color='var(--accent)'; this.style.textDecoration='underline';" 
                                             onmouseout="this.style.color='var(--text)'; this.style.textDecoration='none';"
                                             onclick="loadDetail('albums', '${encodedId}')">💿 ${albumName}</h4>`;
                            } else {
                                html += `<h4 style="margin: 0 0 0.75rem 0; color: #aaa;">💿 ${albumName}</h4>`;
                            }
                            
                            html += `<div style="display: flex; flex-direction: column; gap: 5px;">`;
                            albumSongs.forEach(song => {
                                html += renderSongRow(song);
                            });
                            html += `</div></div>`;
                        }

                        if (singleSongs.length > 0) {
                            html += `<div style="margin-top: 1.5rem;">
                                        <h4 style="margin: 0 0 0.75rem 0; color: #aaa;">🎵 Singles / Other</h4>
                                        <div style="display: flex; flex-direction: column; gap: 5px;">`;
                            singleSongs.forEach(song => {
                                html += renderSongRow(song);
                            });
                            html += `</div></div>`;
                        }
                    } else {
                        // If we are looking at an album's tracklist, leave it as a flat list
                        html += `<div style="display: flex; flex-direction: column; gap: 5px; margin-top: 1rem;">`;
                        songs.forEach(song => {
                            html += renderSongRow(song);
                        });
                        html += `</div>`;
                    }
                }

                // Render Catalog of Albums (Artists)
                const albums = data.albums;
                if (albums && Array.isArray(albums) && albums.length > 0) {
                    let albumHtml = '';
                    albums.forEach(album => {
                        const albumId = album.id || album.album_id || album.ref || album.path || '';
                        const title = album.title || album.name || 'Unknown Album';
                        const cleanId = String(albumId).replace(/^albums\//, '').replace(/\.json$/, '');
                        
                        if (renderedAlbumIds.has(cleanId)) return;

                        const encodedId = cleanId ? encodeURIComponent(cleanId) : '';
                        
                        albumHtml += `<div style="background: #222; padding: 10px; border-radius: 4px; cursor: pointer; border: 1px solid var(--border);"
                                     onmouseover="this.style.borderColor='var(--accent)'" 
                                     onmouseout="this.style.borderColor='var(--border)'"
                                     onclick="loadDetail('albums', '${encodedId}')">
                                    <strong style="color: white;">${title}</strong>
                                 </div>`;
                    });
                    if (albumHtml) {
                        html += `<h3 style="margin-top: 2rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem;">Other Albums</h3>`;
                        html += `<div style="display: flex; flex-direction: column; gap: 5px; margin-top: 1rem;">`;
                        html += albumHtml;
                        html += `</div>`;
                    }
                }

                // Fallback to raw JSON if none of the explicit UI blocks were generated
                if (!html) {
                     html = `<pre style="white-space: pre-wrap; word-wrap: break-word;">${JSON.stringify(data, null, 2)}</pre>`;
                }
                
                stats.innerHTML = html;
                
            } catch (err) {
                errorDiv.textContent = err.message;
                errorDiv.style.display = 'block';
            } finally {
                loading.style.display = 'none';
            }
        }

        async function initializeLatestChart() {
            const dateInput = document.getElementById('dateInput');
            
            let d = new Date();
            let diff = 6 - d.getUTCDay();
            d.setUTCDate(d.getUTCDate() + diff);
            
            let foundDate = null;
            let attempts = 0;
            const maxAttempts = 8; 

            document.getElementById('loading').style.display = 'block';
            document.getElementById('loading').textContent = 'Finding latest chart...';

            while (attempts < maxAttempts) {
                const dateStr = d.toISOString().split('T')[0];
                try {
                    const response = await fetch(`${DATA_DIR}/hot100/${dateStr}.json`, { method: 'HEAD' });
                    if (response.ok) {
                        foundDate = dateStr;
                        break;
                    }
                } catch (e) {}
                
                d.setUTCDate(d.getUTCDate() - 7);
                attempts++;
            }

            if (foundDate) {
                dateInput.value = foundDate;
            } else {
                dateInput.value = "2026-05-16";
            }
            
            document.getElementById('loading').textContent = 'Fetching data...';
            loadChart();
        }

        document.addEventListener('DOMContentLoaded', () => {
            initializeLatestChart();
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billboard Stats Shell</title>
    <style>
        :root {
            --bg: #121212;
            --text: #e0e0e0;
            --accent: #ff4757;
            --border: #333;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
        }
        input, select, button {
            padding: 0.5rem 1rem;
            background: #222;
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 4px;
        }
        button {
            background: var(--accent);
            color: white;
            cursor: pointer;
            font-weight: bold;
            border: none;
        }
        button:hover { background: #ff6b81; }
        .chart-entry {
            display: flex;
            align-items: center;
            padding: 1rem;
            border-bottom: 1px solid var(--border);
        }
        .rank {
            font-size: 1.5rem;
            font-weight: bold;
            width: 50px;
            color: var(--accent);
        }
        .details h3 { margin: 0 0 0.25rem 0; }
        .details p { margin: 0; color: #888; font-size: 0.9rem; }
    </style>
</head>
<body>

    <h1>Billboard Stats</h1>
    
    <div style="margin-bottom: 2rem; display: flex; gap: 1rem; flex-wrap: wrap;">
        <select id="chartType">
            <option value="hot100">Hot 100</option>
            <option value="b200">Billboard 200</option>
        </select>
        <input type="date" id="dateInput" value="2026-04-04">
        <button onclick="loadChart()">Load Week</button>
        <input type="text" id="searchInput" placeholder="Search index... (needs ETL update)">
    </div>

    <div id="loading" style="display: none;">Fetching data...</div>
    <div id="error" style="color: #ff4757; display: none;"></div>
    <div id="chartContainer"></div>

    <script>
        const DATA_DIR = './billboard_stats/data';

        // Helper function to force any selected date to its corresponding Saturday
        function snapToSaturday(dateStr) {
            // Append time/Z to prevent timezone drift when parsing the date string
            const d = new Date(dateStr + "T00:00:00Z");
            const day = d.getUTCDay(); // 0 is Sunday, 6 is Saturday
            
            // Calculate how many days to shift to hit Saturday
            const diff = 6 - day; 
            d.setUTCDate(d.getUTCDate() + diff);
            
            return d.toISOString().split('T')[0];
        }

        async function loadChart() {
            const chartType = document.getElementById('chartType').value;
            const rawDate = document.getElementById('dateInput').value;
            
            if (!rawDate) return;

            const container = document.getElementById('chartContainer');
            const errorDiv = document.getElementById('error');
            const loading = document.getElementById('loading');

            container.innerHTML = '';
            errorDiv.style.display = 'none';
            loading.style.display = 'block';

            // Snap the date and update the UI so the user sees the actual chart date
            const snappedDate = snapToSaturday(rawDate);
            document.getElementById('dateInput').value = snappedDate;

            try {
                const response = await fetch(`${DATA_DIR}/${chartType}/${snappedDate}.json`);
                
                if (!response.ok) {
                    throw new Error(`Chart data for ${snappedDate} not found. Are you sure you pushed the ETL data to GitHub?`);
                }

                const data = await response.json();
                renderChart(data);
            } catch (err) {
                errorDiv.textContent = err.message;
                errorDiv.style.display = 'block';
            } finally {
                loading.style.display = 'none';
            }
        }

        function renderChart(data) {
            const container = document.getElementById('chartContainer');
            
            data.forEach(track => {
                const row = document.createElement('div');
                row.className = 'chart-entry';
                
                row.innerHTML = `
                    <div class="rank">${track.rank || track.position}</div>
                    <div class="details">
                        <h3>${track.title || track.song}</h3>
                        <p>${track.artist}</p>
                    </div>
                `;
                container.appendChild(row);
            });
        }
    </script>
</body>
</html>
